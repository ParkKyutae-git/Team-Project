<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Theme Settings</title>
    <!-- Tailwind CSS CDN (추후 프로젝트에서는 npm install tailwindcss 로 세팅) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Scrollbar for the main content */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-gray-200 h-screen w-full flex items-center justify-center font-sans antialiased">

    <!-- App Container (추후 React의 <App /> 루트 컴포넌트에 해당) -->
    <div class="w-[1024px] h-[720px] bg-white rounded-xl shadow-2xl flex overflow-hidden border border-gray-300">
        
        <!-- Sidebar Component -->
        <aside class="w-[280px] bg-[#1e1e1e] text-white flex flex-col">
            <!-- Logo Area -->
            <div class="p-6">
                <div class="flex items-center gap-2 text-green-400 font-bold text-xl tracking-wider">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
                    <span>APP LOGO</span>
                </div>
            </div>

            <!-- User Info Dropdown Trigger (추후 Zustand에서 user state를 받아와 렌더링) -->
            <div class="px-4 mb-6">
                <div class="bg-white text-black rounded-lg p-2 flex items-center justify-between cursor-pointer hover:bg-gray-100 transition">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs">U</div>
                        <span class="font-medium text-sm">User</span>
                        <!-- [Badge Component] -->
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-600 border border-blue-200">Member</span>
                    </div>
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>

            <!-- Navigation Menu -->
            <nav class="flex-1 px-4 space-y-2">
                <a href="#" class="flex items-center justify-between p-3 rounded-lg bg-white/10 text-white border-l-4 border-green-400">
                    <span class="font-medium">프로필 설정</span>
                    <span>›</span>
                </a>
                <a href="#" onclick="openModal()" class="flex items-center justify-between p-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition">
                    <span class="font-medium">테마 전환 (모달)</span>
                    <span>›</span>
                </a>
                <a href="#" class="flex items-center justify-between p-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition">
                    <span class="font-medium">알림 설정</span>
                    <span>›</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area (그라데이션 배경 적용) -->
        <main class="flex-1 bg-gradient-to-b from-[#6ee7b7] to-[#fde047] flex flex-col relative overflow-hidden">
            
            <!-- Top Search Bar -->
            <header class="p-6 pb-2">
                <!-- [Input Component] -->
                <div class="relative w-2/3">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" class="bg-white/40 backdrop-blur-sm border border-white/50 text-gray-800 text-sm rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none block w-full pl-10 p-2.5 placeholder-gray-600 transition" placeholder="설정 메뉴 검색...">
                </div>
            </header>

            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto p-6 pt-4">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b border-gray-800/20 pb-2 inline-block w-full max-w-sm">내 계정 관리</h2>
                
                <div class="space-y-4 max-w-3xl">
                    <!-- Profile Edit Card -->
                    <div class="bg-white/30 backdrop-blur-md rounded-xl p-6 border border-white/40 shadow-sm flex items-center justify-between hover:bg-white/40 transition">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-gradient-to-tr from-blue-400 to-purple-500 rounded-full flex items-center justify-center text-white text-xl font-bold shadow-inner cursor-pointer hover:opacity-80 transition">
                                U
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-gray-800">프로필 사진</h3>
                                <p class="text-sm text-gray-600">팀원들이 알아볼 수 있는 사진으로 변경해보세요.</p>
                            </div>
                        </div>
                        <!-- [Button Component] -->
                        <button class="bg-[#1e1e1e] hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">변경</button>
                    </div>

                    <!-- Nickname Edit Card -->
                    <div class="bg-white/30 backdrop-blur-md rounded-xl p-6 border border-white/40 shadow-sm flex items-center justify-between hover:bg-white/40 transition">
                        <div class="w-full mr-6">
                            <h3 class="text-lg font-semibold text-gray-800 mb-2">표시 이름 (닉네임)</h3>
                            <!-- [Input Component] -->
                            <input type="text" value="User" class="bg-white/50 border border-gray-300/50 text-gray-800 text-sm rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none block w-full p-2.5 transition">
                        </div>
                        <div class="self-end">
                            <!-- [Button Component] -->
                            <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition shadow-sm whitespace-nowrap">저장</button>
                        </div>
                    </div>

                    <!-- Status Message Card -->
                    <div class="bg-white/30 backdrop-blur-md rounded-xl p-6 border border-white/40 shadow-sm hover:bg-white/40 transition cursor-pointer flex justify-between items-center">
                        <span class="font-medium text-gray-800">상태 메시지 설정</span>
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- [Modal Component] Theme Switcher Modal -->
    <!-- 초기에는 hidden 처리, JS로 토글. 추후 React에서는 조건부 렌더링(isOpen && <Modal/>)으로 구현 -->
    <div id="themeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
        
        <!-- Modal Content -->
        <div class="bg-white rounded-xl shadow-2xl w-[400px] z-10 overflow-hidden transform transition-all">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">테마 설정</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <p class="text-sm text-gray-600 mb-6">앱의 전체적인 분위기를 결정합니다.</p>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Light Theme Option -->
                    <div class="border-2 border-green-500 rounded-lg p-2 cursor-pointer">
                        <div class="h-20 bg-gray-100 rounded flex overflow-hidden border border-gray-200">
                            <div class="w-1/3 bg-gray-800"></div>
                            <div class="w-2/3 bg-gradient-to-b from-[#6ee7b7] to-[#fde047]"></div>
                        </div>
                        <p class="text-center mt-2 text-sm font-medium text-gray-800">그라데이션 (현재)</p>
                    </div>
                    
                    <!-- Dark Theme Option -->
                    <div class="border border-gray-200 rounded-lg p-2 cursor-pointer hover:border-gray-400 transition opacity-60">
                        <div class="h-20 bg-gray-900 rounded flex overflow-hidden">
                            <div class="w-1/3 bg-black"></div>
                            <div class="w-2/3 bg-gray-800"></div>
                        </div>
                        <p class="text-center mt-2 text-sm font-medium text-gray-600">다크 모드</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-gray-50 px-6 py-4 flex justify-end gap-2 border-t">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">취소</button>
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">적용하기</button>
            </div>
        </div>
    </div>

    <script>
        // 향후 React의 useState 또는 zustand의 action으로 대체될 모달 제어 로직
        const modal = document.getElementById('themeModal');
        
        function openModal() {
            modal.classList.remove('hidden');
        }
        
        function closeModal() {
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>
